name: Dependabot automerge

# Enable auto-merge on Dependabot's minor and patch updates. GitHub still
# enforces the `main` ruleset: CI must pass, the branch must be current, and
# merges must be rebases. Major updates are left for manual review.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      - name: Approve and enable auto-merge for minor/patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The ruleset dismisses approvals when Dependabot pushes, so
          # re-approve on subsequent events (without spamming duplicate
          # approvals).
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length')" = "0" ]; then
            gh pr review --approve "$PR_URL"
          fi
          gh pr merge --auto --rebase "$PR_URL"
