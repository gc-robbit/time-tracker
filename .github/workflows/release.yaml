name: Release

# Manual for now: run from the Actions tab. A tag-triggered (`push: tags`)
# release can replace the `workflow_dispatch` input later.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0 (created at this commit if missing)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run tools/build_dist.py
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like v1.2.3, got: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/time-tracker --clobber
          else
            gh release create "$TAG" dist/time-tracker \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
