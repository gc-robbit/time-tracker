name: Release

# Manual for now: run from the Actions tab. The next version is derived from
# the Conventional Commits since the last tag.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A job's name is fixed before its steps run, so compute the next version
  # first and expose it to the release job through `needs`.
  prepare:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Determine next version
        id: next
        run: |
          # Exit codes 3 and 21 mean there is nothing eligible to release.
          version="$(uv run --frozen cz --no-raise 3,21 bump --get-next)"
          if [ -z "$version" ]; then
            echo "Nothing to release: no bump-eligible commits since the last tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    name: Release ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A PAT is required: GITHUB_TOKEN cannot bypass the `main` ruleset.
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version and changelog
        id: bump
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          old_sha="$(git rev-parse HEAD)"
          uv run --frozen cz bump "$VERSION" --yes
          if [ "$(git rev-parse HEAD)" = "$old_sha" ]; then
            echo "Nothing to release: no bump-eligible commits since the last tag." >&2
            exit 1
          fi
          echo "tag=$(uv run --frozen cz version -p --tag)" >> "$GITHUB_OUTPUT"
          echo "version=$(uv run --frozen cz version -p)" >> "$GITHUB_OUTPUT"
      - name: Keep the lockfile in sync with the bump commit
        run: |
          uv lock
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit --no-verify
            git tag -f -a "${{ steps.bump.outputs.tag }}" -m "${{ steps.bump.outputs.tag }}"
          fi
      - run: uv run tools/build_dist.py
      - name: Push bump commit and tag
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          uv run --frozen cz changelog --dry-run "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" dist/time-tracker \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
