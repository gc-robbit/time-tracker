[project]
name = "time-tracker"
version = "0.6.0"
description = "A time tracking application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
time-tracker = "time_tracker:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "prek>=0.5.7",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.commitizen]
version_provider = "pep621"
tag_format = "v$version"
annotated_tag = true
major_version_zero = true
update_changelog_on_bump = true
bump_message = "chore: bump version $current_version → $new_version"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
